<!-- Reusable User Profile Avatar Dropdown Component -->
<div class="user-avatar-wrapper" style="position: relative; display: inline-block;">
    <button type="button" class="user-avatar-btn js-user-avatar-btn" aria-label="User Account Menu" title="User Menu" style="background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:8px">
        <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--cyan,#0284c7),var(--purple,#8b5cf6));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;overflow:hidden;border:2px solid rgba(255,255,255,0.2);box-shadow:0 2px 8px rgba(0,0,0,0.2);transition:transform 0.2s">
            {% if request.user.profile.avatar_src %}
            <img src="{{ request.user.profile.avatar_src }}" style="width:100%;height:100%;object-fit:cover;">
            {% elif request.user.profile.avatar %}
            <img src="{{ request.user.profile.avatar.url }}" style="width:100%;height:100%;object-fit:cover;">
            {% else %}
            {{ request.user.email|first|upper }}
            {% endif %}
        </div>
    </button>

    <div class="user-avatar-dropdown js-user-avatar-dropdown" style="display: none; position: absolute; top: 48px; right: 0; width: 220px; background: #0f172a; border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); z-index: 99999; overflow: hidden; padding: 6px;">
        <div style="padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 4px;">
            <div style="font-weight: 700; font-size: 13px; color: var(--text, #f8fafc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                {{ request.user.get_full_name|default:request.user.username }}
            </div>
            <div style="font-size: 11px; color: var(--text2, #94a3b8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                {{ request.user.email }}
            </div>
        </div>

        <a href="/settings/" class="user-dropdown-item" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: var(--text, #f8fafc); text-decoration: none; font-size: 13px; font-weight: 600; transition: background 0.2s;">
            ⚙️ Profile & Settings
        </a>
        <a href="/logout/" class="user-dropdown-item" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: #ef4444; text-decoration: none; font-size: 13px; font-weight: 600; transition: background 0.2s;">
            🚪 Log Out
        </a>
    </div>
</div>

<style>
body.light-theme .user-avatar-dropdown, html.light-theme .user-avatar-dropdown {
    background: #ffffff !important;
    border-color: #cbd5e1 !important;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15) !important;
}
.user-dropdown-item:hover {
    background: rgba(255,255,255,0.08) !important;
}
body.light-theme .user-dropdown-item:hover, html.light-theme .user-dropdown-item:hover {
    background: #f1f5f9 !important;
}
</style>

<script>
(function() {
    if (window.__userDropdownInitialized) return;
    window.__userDropdownInitialized = true;

    document.addEventListener('click', function(e) {
        const wrappers = document.querySelectorAll('.user-avatar-wrapper');
        wrappers.forEach(wrapper => {
            const btn = wrapper.querySelector('.js-user-avatar-btn');
            const dropdown = wrapper.querySelector('.js-user-avatar-dropdown');
            if (btn && dropdown) {
                if (btn.contains(e.target)) {
                    e.stopPropagation();
                    const isDisplayed = dropdown.style.display === 'block';
                    document.querySelectorAll('.js-user-avatar-dropdown').forEach(d => d.style.display = 'none');
                    dropdown.style.display = isDisplayed ? 'none' : 'block';
                } else if (!dropdown.contains(e.target)) {
                    dropdown.style.display = 'none';
                }
            }
        });
    });
})();
</script>
