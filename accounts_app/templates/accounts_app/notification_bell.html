<!-- Real-Time Notification Bell Component -->
<div class="notif-wrapper" style="position: relative; display: inline-block;">
    <button id="notifBellBtn" class="notif-bell-btn" type="button" aria-label="Notifications" title="Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span id="notifBadge" class="notif-badge" style="display: none;">0</span>
    </button>

    <!-- Notification Dropdown Panel -->
    <div id="notifDropdown" class="notif-dropdown" style="display: none;">
        <div class="notif-header">
            <div class="notif-header-title">
                <span style="font-weight: 700; font-size: 0.95rem;">Notifications</span>
                <span id="notifUnreadPill" class="notif-pill">0 New</span>
            </div>
            <button id="notifMarkAllBtn" type="button" class="notif-action-btn">Mark all read</button>
        </div>

        <div id="notifList" class="notif-list">
            <div class="notif-empty">
                <div class="notif-empty-icon">🔔</div>
                <div>No notifications yet</div>
            </div>
        </div>

        <div class="notif-footer">
            <a href="/notifications/" class="notif-view-all">View All Notifications →</a>
        </div>
    </div>
</div>

<style>
/* Notification Bell Styling */
.notif-bell-btn {
    position: relative;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--text, #f8fafc);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
}
.notif-bell-btn svg {
    stroke: currentColor;
    width: 20px;
    height: 20px;
    display: block;
}
.notif-bell-btn:hover {
    background: rgba(37, 99, 235, 0.2);
    border-color: #2563eb;
    color: #38bdf8;
}

body.light-theme .notif-bell-btn, html.light-theme .notif-bell-btn {
    background: #e2e8f0 !important;
    border-color: #cbd5e1 !important;
    color: #0f172a !important;
}
body.light-theme .notif-bell-btn:hover, html.light-theme .notif-bell-btn:hover {
    background: #dbeafe !important;
    border-color: #2563eb !important;
    color: #2563eb !important;
}

.notif-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    background: #ef4444;
    color: #ffffff;
    font-size: 11px;
    font-weight: 800;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg-card, #0f172a);
    animation: pulseBadge 2s infinite;
}
@keyframes pulseBadge {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
    70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}

.notif-dropdown {
    position: absolute;
    top: 48px;
    right: 0;
    width: 360px;
    max-width: 90vw;
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 14px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    z-index: 9999;
    overflow: hidden;
    color: #f8fafc;
}
body.light-theme .notif-dropdown {
    background: #ffffff;
    border-color: #cbd5e1;
    color: #0f172a;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
}

.notif-header {
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.04);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
}
body.light-theme .notif-header {
    background: #f8fafc;
    border-bottom-color: #e2e8f0;
}

.notif-pill {
    background: #2563eb;
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 12px;
    margin-left: 6px;
}

.notif-action-btn {
    background: transparent;
    border: none;
    color: #38bdf8;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}
body.light-theme .notif-action-btn {
    color: #2563eb;
}
.notif-action-btn:hover {
    text-decoration: underline;
}

.notif-list {
    max-height: 340px;
    overflow-y: auto;
}

.notif-item {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    display: flex;
    gap: 12px;
    align-items: flex-start;
    transition: background 0.2s ease;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
}
body.light-theme .notif-item {
    border-bottom-color: #f1f5f9;
}
.notif-item:hover {
    background: rgba(255, 255, 255, 0.05);
}
body.light-theme .notif-item:hover {
    background: #f8fafc;
}
.notif-item.unread {
    background: rgba(37, 99, 235, 0.1);
}
body.light-theme .notif-item.unread {
    background: #eff6ff;
}

.notif-icon-badge {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
}
.notif-icon-payment { background: rgba(16, 185, 129, 0.2); color: #10b981; }
.notif-icon-booking { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
.notif-icon-course { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
.notif-icon-agent { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
.notif-icon-system { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }

.notif-content {
    flex: 1;
    min-width: 0;
}
.notif-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 2px;
    color: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
body.light-theme .notif-title {
    color: #0f172a;
}
.notif-time {
    font-size: 10px;
    color: #94a3b8;
    font-weight: 500;
}
body.light-theme .notif-time {
    color: #64748b;
}
.notif-msg {
    font-size: 12px;
    color: #cbd5e1;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
body.light-theme .notif-msg {
    color: #334155;
}

.notif-empty {
    padding: 32px 16px;
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
}
.notif-empty-icon {
    font-size: 24px;
    margin-bottom: 6px;
}

.notif-footer {
    padding: 10px 16px;
    background: rgba(0, 0, 0, 0.2);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    text-align: center;
}
body.light-theme .notif-footer {
    background: #f8fafc;
    border-top-color: #e2e8f0;
}
.notif-view-all {
    font-size: 12px;
    font-weight: 700;
    color: #38bdf8;
    text-decoration: none;
}
body.light-theme .notif-view-all {
    color: #0284c7;
}
.notif-view-all:hover {
    text-decoration: underline;
}
</style>

<script>
(function() {
    const bellBtn = document.getElementById('notifBellBtn');
    const dropdown = document.getElementById('notifDropdown');
    const badge = document.getElementById('notifBadge');
    const unreadPill = document.getElementById('notifUnreadPill');
    const notifList = document.getElementById('notifList');
    const markAllBtn = document.getElementById('notifMarkAllBtn');

    if (!bellBtn || !dropdown) return;

    // Toggle dropdown
    bellBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const isOpen = dropdown.style.display === 'block';
        dropdown.style.display = isOpen ? 'none' : 'block';
        if (!isOpen) fetchNotifications();
    });

    document.addEventListener('click', function(e) {
        if (!dropdown.contains(e.target) && !bellBtn.contains(e.target)) {
            dropdown.style.display = 'none';
        }
    });

    function getIconClass(type) {
        switch(type) {
            case 'payment': return { cls: 'notif-icon-payment', icon: '💳' };
            case 'booking': return { cls: 'notif-icon-booking', icon: '📅' };
            case 'course': return { cls: 'notif-icon-course', icon: '🎓' };
            case 'agent': return { cls: 'notif-icon-agent', icon: '🤖' };
            default: return { cls: 'notif-icon-system', icon: '🔔' };
        }
    }

    function fetchNotifications() {
        fetch('/api/notifications/')
            .then(res => res.json())
            .then(data => {
                if (data.unread_count > 0) {
                    badge.innerText = data.unread_count > 99 ? '99+' : data.unread_count;
                    badge.style.display = 'flex';
                    unreadPill.innerText = `${data.unread_count} New`;
                } else {
                    badge.style.display = 'none';
                    unreadPill.innerText = '0 New';
                }

                if (!data.notifications || data.notifications.length === 0) {
                    notifList.innerHTML = `
                        <div class="notif-empty">
                            <div class="notif-empty-icon">🔔</div>
                            <div>No notifications yet</div>
                        </div>`;
                    return;
                }

                let html = '';
                data.notifications.forEach(item => {
                    const iconInfo = getIconClass(item.type);
                    const unreadClass = item.is_read ? '' : 'unread';
                    html += `
                        <a href="${item.link}" class="notif-item ${unreadClass}" data-id="${item.id}">
                            <div class="notif-icon-badge ${iconInfo.cls}">${iconInfo.icon}</div>
                            <div class="notif-content">
                                <div class="notif-title">
                                    <span>${escapeHtml(item.title)}</span>
                                    <span class="notif-time">${item.created_at}</span>
                                </div>
                                <div class="notif-msg">${escapeHtml(item.message)}</div>
                            </div>
                        </a>`;
                });
                notifList.innerHTML = html;

                // Add click listener to mark single read
                notifList.querySelectorAll('.notif-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.getAttribute('data-id');
                        if (id) {
                            fetch(`/api/notifications/${id}/read/`, { method: 'POST' });
                        }
                    });
                });
            })
            .catch(err => console.error('Failed to fetch notifications:', err));
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    if (markAllBtn) {
        markAllBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            fetch('/api/notifications/read-all/', { method: 'POST' })
                .then(() => fetchNotifications());
        });
    }

    // Initial fetch + 15 second background poll
    fetchNotifications();
    setInterval(fetchNotifications, 15000);
})();
</script>
